<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Explorer · cohesive-llm-benchmark</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header>
  <a class="github-link" href="https://github.com/genpat-it/cohesive-llm-benchmark" target="_blank">GitHub →</a>
  <h1>cohesive-llm-benchmark · explorer</h1>
  <div class="tagline">Click any row to see the prompt, ground-truth <code>.nf</code> and the LLM-generated <code>.nf</code> side-by-side.</div>
  <nav>
    <a href="./">Overview</a>
    <a href="explorer.html" class="active">Explorer</a>
    <a href="https://github.com/genpat-it/cohesive-llm-benchmark/blob/main/METHODOLOGY.md">Methodology</a>
    <a href="https://github.com/genpat-it/cohesive-llm-benchmark/blob/main/docs/error_taxonomy.md">Error taxonomy</a>
    <a href="https://github.com/genpat-it/cohesive-llm-benchmark/blob/main/docs/dataset_schema.md">Schema</a>
  </nav>
</header>

<main>
  <div id="version-banner"></div>
  <div class="filters">
    <label>corpus
      <select id="corpus">
        <optgroup label="LLM eval against the FULL corpus">
          <option value="full200">single-turn LLM eval (200)</option>
          <option value="fullMT">multi-turn LLM eval (159 convs · 330 turns)</option>
          <option value="multiWF">multi-sample workflows LLM eval (5)</option>
        </optgroup>
        <optgroup label="LLM eval against the curated subset">
          <option value="single">single-turn LLM eval (50)</option>
          <option value="multi">multi-turn LLM eval (34 turns)</option>
        </optgroup>
      </select>
    </label>
    <label>category
      <select id="filter-category"><option value="">all</option></select>
    </label>
    <label>error category
      <select id="filter-error"><option value="">all</option></select>
    </label>
    <label>outcome
      <select id="filter-outcome">
        <option value="">all</option>
        <option value="pass">PASS only</option>
        <option value="fail">FAIL only</option>
      </select>
    </label>
    <label>tag
      <select id="filter-tag">
        <option value="">all</option>
        <option value="literal-match">literal-match</option>
        <option value="extras-best-practice">extras-best-practice</option>
        <option value="extras-irrelevant">extras-irrelevant</option>
        <option value="missing-steps">missing-steps</option>
        <option value="hallucinated">hallucinated</option>
      </select>
    </label>
    <label>search
      <input id="filter-text" type="text" placeholder="id / prompt / step…">
    </label>
    <span class="stat" id="row-stat"></span>
  </div>

  <table class="bench" id="tbl">
    <thead>
      <tr>
        <th>id</th>
        <th>category</th>
        <th>outcome</th>
        <th>tags</th>
        <th>n_proc</th>
        <th>error</th>
        <th>steps used</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

</main>

<footer>
  cohesive-llm-benchmark · <a href="https://github.com/genpat-it/cohesive-llm-benchmark">source</a>
</footer>

<script src="assets/app.js"></script>
<script>
let ALL = { single: [], multi: [], full200: [], fullMT: [], multiWF: [] };
let META = { single: null, multi: null, full200: null, fullMT: null, multiWF: null };
let CUR = "full200";

function flattenDatasetForExplorer(raw) {
  // Make dataset entries look enough like verdicts that render() can reuse the
  // table layout, but DO NOT pretend the LLM was tested -- set is_dataset_only=true
  // and leave the verdict-side fields null so the UI can render a "GT only"
  // indicator instead of a misleading PASS.
  const rows = [];
  for (const d of raw) {
    if (Array.isArray(d.turns)) {
      d.turns.forEach((t, i) => {
        rows.push({
          id: `${d.id}_t${i + 1}`,
          conv_id: d.id,
          turn_index: i + 1,
          modification_kind: d.modification_kind,
          base_id: d.base_id,
          category: `${d.category}.${d.modification_kind || "?"}`,
          prompt: t.prompt,
          ground_truth_code: t.nextflow_code,
          nextflow_code: null,
          params: t.params,
          expected_processes: t.expected_processes,
          is_dataset_only: true,
        });
      });
    } else {
      rows.push({
        id: d.id,
        category: d.category,
        prompt: d.prompt,
        ground_truth_code: d.nextflow_code,
        nextflow_code: null,
        params: d.params,
        expected_processes: d.validation?.expected_processes,
        is_dataset_only: true,
      });
    }
  }
  return rows;
}

async function init() {
  const [vSingle, vMulti, mSingle, mMulti,
         vFull200, vFullMT, mFull200, mFullMT,
         vMultiWF, mMultiWF] = await Promise.all([
    loadJsonl(DATA.SINGLE_TURN_VERDICTS),
    loadJsonl(DATA.MULTI_TURN_VERDICTS),
    loadMeta(DATA.SINGLE_TURN_METADATA),
    loadMeta(DATA.MULTI_TURN_METADATA),
    loadJsonl(DATA.FULL_SINGLE_VERDICTS).catch(() => []),
    loadJsonl(DATA.FULL_MULTI_VERDICTS).catch(() => []),
    loadMeta("data/llm_full_200_metadata.json"),
    loadMeta("data/llm_full_multi_turn_metadata.json"),
    loadJsonl("data/llm_multi_workflows_verdicts_augmented.jsonl").catch(() => []),
    loadMeta("data/llm_multi_workflows_metadata.json").catch(() => null),
  ]);
  ALL.single  = vSingle;  ALL.multi   = vMulti;
  ALL.full200 = vFull200; ALL.fullMT  = vFullMT;
  ALL.multiWF = vMultiWF;
  META.single = mSingle;  META.multi  = mMulti;
  META.full200 = mFull200; META.fullMT = mFullMT;
  META.multiWF = mMultiWF;

  // honour deep link in URL hash:  #corpus/row-id
  const m = (location.hash || "").match(/^#([^/]+)\/(.+)$/);
  if (m) {
    const [, c, rid] = m;
    if (c in ALL) {
      CUR = c;
      document.getElementById("corpus").value = c;
    }
    rebuildSelectors();
    updateBanner();
    render();
    // expand the requested row, if it's currently visible in the table
    const tr = document.querySelector(`#tbl tbody tr[data-id="${CSS.escape(rid)}"]`);
    if (tr) tr.click();
  } else {
    rebuildSelectors();
    updateBanner();
    render();
  }
}

window.addEventListener("hashchange", () => {
  // Re-process the hash on browser back/forward
  const m = (location.hash || "").match(/^#([^/]+)\/(.+)$/);
  if (!m) return;
  const [, c, rid] = m;
  if (c in ALL && c !== CUR) {
    CUR = c;
    document.getElementById("corpus").value = c;
    rebuildSelectors();
    updateBanner();
    render();
  }
  const tr = document.querySelector(`#tbl tbody tr[data-id="${CSS.escape(rid)}"]`);
  if (tr && !tr.classList.contains("active-row")) tr.click();
});

function updateBanner() {
  const dsName = {
    "single":  "dataset_50.jsonl",
    "multi":   "dataset_modifications.jsonl",
    "full200": "dataset_200.jsonl",
    "fullMT":  "dataset_modifications_full.jsonl",
    "multiWF": "dataset_205.jsonl (X* subset)",
  }[CUR] || "?";
  const banner = document.getElementById("version-banner");
  banner.innerHTML = metaBanner(META[CUR], dsName);
}

function active() { return ALL[CUR]; }

function rebuildSelectors() {
  const data = active();
  const cats = Array.from(new Set(data.map(d => d.category))).filter(Boolean).sort();
  const errs = Array.from(new Set(data.map(d => d.error_category))).filter(Boolean).sort();
  const catSel = document.getElementById("filter-category");
  const errSel = document.getElementById("filter-error");
  catSel.innerHTML = '<option value="">all</option>' + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
  errSel.innerHTML = '<option value="">all</option>' + errs.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join("");
}

function render() {
  const data = active();
  const fc = document.getElementById("filter-category").value;
  const fe = document.getElementById("filter-error").value;
  const fo = document.getElementById("filter-outcome").value;
  const ftag = document.getElementById("filter-tag").value;
  const ft = document.getElementById("filter-text").value.toLowerCase();

  const rows = data.filter(d => {
    if (fc && d.category !== fc) return false;
    if (fe && d.error_category !== fe) return false;
    if (fo === "pass" && !d.semantic_valid) return false;
    if (fo === "fail" && d.semantic_valid) return false;
    if (ftag && !(d.verdict_tags || []).includes(ftag)) return false;
    if (ft) {
      const hay = (
        d.id + " " + (d.prompt || "") + " " +
        (d.called_steps || []).join(" ") + " " +
        (d.included_steps || []).join(" ")
      ).toLowerCase();
      if (!hay.includes(ft)) return false;
    }
    return true;
  });

  const tbody = document.querySelector("#tbl tbody");
  tbody.innerHTML = rows.map((d, i) => {
    if (d.is_dataset_only) {
      return `
        <tr data-idx="${i}" data-id="${esc(d.id)}">
          <td><code>${esc(d.id)}</code></td>
          <td>${esc(d.category)}</td>
          <td><span class="pill muted">GT only</span></td>
          <td></td>
          <td>—/${d.expected_processes ?? "?"}</td>
          <td><span class="muted">— not LLM-evaluated —</span></td>
          <td><span class="muted">click to view prompt + ground truth</span></td>
        </tr>`;
    }
    return `
      <tr data-idx="${i}" data-id="${esc(d.id)}">
        <td><code>${esc(d.id)}</code></td>
        <td>${esc(d.category)}</td>
        <td>${passPill(d.semantic_valid)}</td>
        <td>${tagChips(d.verdict_tags)}</td>
        <td>${d.n_processes ?? "?"}/${d.expected_processes ?? "?"}</td>
        <td><code>${esc(d.error_category || "—")}</code></td>
        <td>${(d.called_steps || d.included_steps || []).slice(0, 4).map(s => "<code>" + esc(s) + "</code>").join(", ")}</td>
      </tr>`;
  }).join("");

  const stat = document.getElementById("row-stat");
  if (rows.length && rows[0].is_dataset_only) {
    stat.textContent = `${rows.length} / ${data.length} rows  ·  ground-truth only (no LLM eval against this corpus)`;
  } else {
    stat.textContent = `${rows.length} / ${data.length} rows  ·  ${rows.filter(r => r.semantic_valid).length} pass  ·  ${rows.filter(r => !r.semantic_valid).length} fail`;
  }

  // attach click handlers (skip the inserted detail rows)
  tbody.querySelectorAll("tr:not(.detail-row)").forEach(tr => {
    tr.addEventListener("click", () => showDetail(rows[parseInt(tr.dataset.idx, 10)], tr));
  });
}

function turnBlock(d, isCurrent) {
  if (d.is_dataset_only) {
    return `
      <div class="turn-card ${isCurrent ? 'turn-current' : ''}">
        <div class="turn-header">
          ${d.turn_index ? `<span class="turn-tag">turn ${esc(d.turn_index)}</span>` : ''}
          <span class="turn-prompt">${esc(d.prompt)}</span>
          <span class="turn-status"><span class="pill muted">GT only</span></span>
        </div>
        <div class="turn-meta muted">
          ground-truth example — expected ${d.expected_processes ?? "?"} processes ·
          this corpus has not been LLM-evaluated yet.
        </div>
        <div class="codes" style="grid-template-columns: 1fr">
          <div>
            <div class="label">Ground truth (passes nextflow -stub-run)</div>
            <pre>${esc(d.ground_truth_code || "")}</pre>
          </div>
        </div>
        ${reproduceSnippet(d)}
      </div>`;
  }
  const errCat = d.error_category || "—";
  const llmReply = (d.llm_full_reply || "").trim();
  const turnTrail = (d.llm_turn_logs || [])
    .map(t => `turn ${t.turn} · status=<code>${esc(t.status || "?")}</code> · code=${t.has_code ? "yes" : "no"} · ${(t.elapsed_s ?? "?")}s`)
    .join("<br>");
  const replyBlock = (llmReply || turnTrail) ? `
    <details class="llm-reply">
      <summary>What the LLM said (final reply + ${(d.llm_turn_logs || []).length} turn(s))</summary>
      ${llmReply ? `<div class="reply-text">${esc(llmReply)}</div>` : ""}
      ${turnTrail ? `<div class="turn-trail">${turnTrail}</div>` : ""}
    </details>` : "";
  return `
    <div class="turn-card ${isCurrent ? 'turn-current' : ''}">
      <div class="turn-header">
        ${d.turn_index ? `<span class="turn-tag">turn ${esc(d.turn_index)}</span>` : ''}
        <span class="turn-prompt">${esc(d.prompt)}</span>
        <span class="turn-status">${passPill(d.semantic_valid)} ${tagChips(d.verdict_tags)}</span>
      </div>
      <div class="turn-meta">
        syntax ${passPill(d.syntax_valid)} · ${d.n_processes ?? "?"}/${d.expected_processes ?? "?"} processes ·
        error <code>${esc(errCat)}</code>
        ${d.error_detail ? ` · <span class="muted">${esc(d.error_detail).slice(0, 120)}</span>` : ""}
      </div>
      <div class="turn-steps">
        <span class="key">LLM steps:</span> ${fmtSteps(d.called_steps || d.included_steps)}
        ${(d.extra_steps && d.extra_steps.length) ? ` · <span class="key">extra:</span> ${fmtSteps(d.extra_steps)}` : ""}
        ${(d.missing_steps && d.missing_steps.length) ? ` · <span class="key">missing:</span> ${fmtSteps(d.missing_steps)}` : ""}
        ${(d.hallucinated_steps && d.hallucinated_steps.length) ? ` · <span class="key">hallucinated:</span> ${fmtSteps(d.hallucinated_steps)}` : ""}
      </div>
      ${replyBlock}
      <div class="codes">
        <div>
          <div class="label">Ground truth (passes validation)</div>
          <pre>${esc(d.ground_truth_code || "")}</pre>
        </div>
        <div>
          <div class="label">LLM-generated</div>
          <pre>${esc(d.nextflow_code || "(no code returned)")}</pre>
        </div>
      </div>
      ${reproduceSnippet(d)}
    </div>`;
}


function setHash(corpus, rowId) {
  // Update the URL hash without polluting history so the user can share
  // a deep link to this exact row of this exact corpus.
  const target = (corpus && rowId) ? `#${corpus}/${rowId}` : '';
  if (location.hash !== target) {
    history.replaceState(null, '', location.pathname + location.search + target);
  }
}

function showDetail(d, clickedTr) {
  // Accordion behaviour: insert a detail row right after the clicked row.
  // If the same row is clicked again, collapse. If another row's detail is
  // open elsewhere, close it first.
  const colCount = clickedTr.children.length;
  const next = clickedTr.nextElementSibling;
  const alreadyMine = next && next.classList.contains("detail-row") && next.dataset.forId === clickedTr.dataset.id;

  // Close any previously open detail row anywhere in the table
  clickedTr.parentElement.querySelectorAll("tr.detail-row").forEach(r => r.remove());
  // Remove the "active" highlight from any other row
  clickedTr.parentElement.querySelectorAll("tr.active-row").forEach(r => r.classList.remove("active-row"));

  if (alreadyMine) {
    setHash(null, null);
    return;  // user clicked the same row → collapse
  }

  let title = d.id;
  let header = "";
  let turns = [d];

  if (d.conv_id) {
    const allTurnsOfConv = ALL[CUR]
      .filter(r => r.conv_id === d.conv_id)
      .sort((a, b) => (a.turn_index || 0) - (b.turn_index || 0));
    if (allTurnsOfConv.length > 1) {
      turns = allTurnsOfConv;
      title = `${d.conv_id} — full conversation (${allTurnsOfConv.length} turns)`;
      header = `
        <div class="row"><span class="key">Modification kind:</span> <code>${esc(d.modification_kind)}</code>
        ${d.base_id ? ` · <span class="key">base example:</span> <code>${esc(d.base_id)}</code>` : ""}</div>
        <div class="row"><span class="key">Conversation outcome:</span>
          ${allTurnsOfConv.every(r => r.semantic_valid) ? '<span class="pill pass">all turns PASS</span>' :
            (allTurnsOfConv.some(r => r.semantic_valid) ? '<span class="pill warn">partial PASS</span>' :
                                                          '<span class="pill fail">all turns FAIL</span>')}
        </div>
      `;
    }
  }

  const body = header + turns.map(t => turnBlock(t, t === d))
    .join('<div class="turn-arrow">↓</div>');

  const detailRow = document.createElement("tr");
  detailRow.className = "detail-row";
  detailRow.dataset.forId = clickedTr.dataset.id;
  detailRow.innerHTML = `
    <td colspan="${colCount}">
      <div class="detail-inline">
        <div class="detail-header">
          <span class="detail-title">${esc(title)}</span>
          <button class="detail-close" type="button">close ×</button>
        </div>
        <div class="detail-body">${body}</div>
      </div>
    </td>`;
  clickedTr.classList.add("active-row");
  clickedTr.parentElement.insertBefore(detailRow, clickedTr.nextElementSibling);
  detailRow.querySelector(".detail-close").addEventListener("click", () => {
    detailRow.remove();
    clickedTr.classList.remove("active-row");
    setHash(null, null);
  });
  // remember in URL
  setHash(CUR, clickedTr.dataset.id);
  // scroll the now-expanded row into view (top of viewport)
  clickedTr.scrollIntoView({ behavior: "smooth", block: "start" });
}

["filter-category","filter-error","filter-outcome","filter-tag","filter-text"].forEach(id => {
  document.getElementById(id).addEventListener("input", render);
});
document.getElementById("corpus").addEventListener("change", e => {
  CUR = e.target.value;
  rebuildSelectors();
  document.getElementById("filter-category").value = "";
  document.getElementById("filter-error").value = "";
  updateBanner();
  render();
});

init().catch(err => {
  console.error(err);
  document.querySelector("#tbl tbody").innerHTML =
    `<tr><td colspan="6"><em>Failed to load data: ${esc(err.message)}</em></td></tr>`;
});
</script>
</body>
</html>
